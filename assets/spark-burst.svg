    </line>
    <line x1="35" y1="35" x2="35" y2="65">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.1s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="35" x2="5" y2="35">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="35" x2="65" y2="35">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="35" x2="12" y2="12">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="35" x2="58" y2="58">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="35" x2="12" y2="58">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.05s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="35" x2="58" y2="12">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.35s" repeatCount="indefinite"/>
    </line>
  </g>
